[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adiabum-dataplatform_jd225"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对数据平台工程师·梯度累积与有效批量相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "adiabum" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://adiabum.github.io"
Repository = "https://github.com/adiabum/dataplatform_jd225"
Issues = "https://github.com/adiabum/dataplatform_jd225/issues"

[project.scripts]
dataplatform_jd225 = "dataplatform_jd225:main"

[tool.setuptools]
py-modules = ["dataplatform_jd225"]
